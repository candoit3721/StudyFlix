name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly, so the full print matrix runs against fresh randomised content.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  # Fast feedback on every push: the UI specs plus the print smoke set.
  test:
    name: UI + print smoke
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: UI specs (chromium, firefox, webkit)
        run: npx playwright test --project=chromium --project=firefox --project=webkit
      - name: Print smoke
        run: npx playwright test --project=print --grep "@print-smoke"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-smoke
          path: playwright-report/
          retention-days: 30

  # The full ~460-case layout matrix. Too slow for every push, and it is a
  # genuine fuzz run: the studios generate fresh random questions each time, so
  # every nightly execution samples layouts no previous run has seen.
  print-matrix:
    name: Full print matrix
    if: github.event_name == 'schedule' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Every printable, every layout
        run: npx playwright test --project=print
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-matrix
          path: playwright-report/
          retention-days: 30
