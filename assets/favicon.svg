<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e28"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b"/>
      <stop offset="45%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#99000a"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="#ff2a3f" stroke-width="2" stroke-opacity="0.4" />

  <!-- Stylized Streaming 'S' Ribbon -->
  <path d="M 68 28 C 58 18, 36 18, 30 30 C 24 42, 36 50, 50 54 C 66 58, 76 68, 70 80 C 62 94, 38 94, 28 84" 
        fill="none" stroke="url(#sGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Play Triangle in S Center -->
  <polygon points="46,44 46,62 60,53" fill="url(#cyanGrad)" filter="url(#glow)"/>

  <!-- Graduation Cap Hat on Top of S -->
  <g transform="translate(56, 12) rotate(15) scale(0.42)" filter="url(#glow)">
    <polygon points="40,10 75,25 40,40 5,25" fill="url(#capGrad)" stroke="#ffffff" stroke-width="2"/>
    <polygon points="20,29 20,44 40,52 60,44 60,29 40,36" fill="#b45309"/>
    <!-- Tassel -->
    <path d="M 75 25 Q 85 45, 78 60" fill="none" stroke="#fde047" stroke-width="3"/>
    <circle cx="78" cy="62" r="4" fill="#fde047"/>
    <polygon points="40,18 43,26 51,26 45,31 47,38 40,34 33,38 35,31 29,26 37,26" fill="#ffffff"/>
  </g>
</svg>
