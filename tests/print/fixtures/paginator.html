<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Paginator fixture</title>
<link rel="stylesheet" href="/assets/sf/print.css">
<style>
  @page { size: letter portrait; margin: 0.4in; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; background: #eef; }

  .grid { display: grid; gap: 10px 14px; flex: 1 1 auto; min-height: 0; align-content: start; }
  .cols-1 { grid-template-columns: 1fr; }
  .cols-2 { grid-template-columns: repeat(2, 1fr); }
  .cols-3 { grid-template-columns: repeat(3, 1fr); }
  .cols-4 { grid-template-columns: repeat(4, 1fr); }

  .card { border: 1px solid #94a3b8; padding: 8px; background: #fff; display: flex; flex-direction: column; }
  /* Elastic filler: makes a card grow to fill its grid row, the way a
     worksheet's workspace box does. This is what makes emitted heights differ
     from measured ones. */
  .card .filler { flex: 1; min-height: 24px; border: 1px dashed #cbd5e1; }
  .hdr { border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 10px; }
  .hdr.compact { padding-bottom: 4px; margin-bottom: 6px; font-size: 0.85em; }
  .ftr { border-top: 1px solid #cbd5e1; padding-top: 6px; margin-top: 10px; font-size: 0.8em; }
  /* A full-width card, to prove rows are derived from geometry rather than
     from index % columns. */
  .card.wide { grid-column: 1 / -1; }
</style>
</head>
<body>
  <div id="out"></div>
<script src="/assets/sf/paginate.js"></script>
<script>
/**
 * Test harness. Every knob the specs need is driven from here so the fixture
 * stays declarative and the specs stay readable.
 */
window.buildFixture = function (cfg) {
  cfg = cfg || {};
  var target = document.getElementById('out');
  var cols = cfg.cols || 3;

  // Deliberately ragged heights: the whole point is that no constant can
  // describe how many of these fit on a page.
  function heightFor(i) {
    if (cfg.uniform) return cfg.uniform;
    var pattern = [40, 90, 55, 130, 70, 45, 160, 60, 85, 50];
    return pattern[i % pattern.length];
  }

  function renderItem(item, i) {
    var el = document.createElement('div');
    el.className = 'sf-card card' + (item.wide ? ' wide' : '');
    el.style.minHeight = item.h + 'px';
    el.textContent = '#' + (item.id != null ? item.id : i + 1);
    if (cfg.elastic) {
      var filler = document.createElement('div');
      filler.className = 'filler';
      el.appendChild(filler);
    }
    return el;
  }

  function renderHeader(pageIdx, total) {
    var h = document.createElement('div');
    h.className = 'hdr' + (pageIdx === 0 ? '' : ' compact');
    h.textContent = pageIdx === 0
      ? 'Fixture worksheet - full header with name, date and score'
      : 'Fixture worksheet (page ' + (pageIdx + 1) + ' of ' + total + ')';
    if (pageIdx === 0) h.style.minHeight = '70px';
    return h;
  }

  function renderFooter(pageIdx, total) {
    var f = document.createElement('div');
    f.className = 'ftr';
    f.textContent = 'Page ' + (pageIdx + 1) + ' of ' + total;
    return f;
  }

  function makeItems(n) {
    var out = [];
    for (var i = 0; i < n; i++) {
      out.push({
        id: i + 1,
        h: heightFor(i),
        // Every 7th item spans the full grid width when asked.
        wide: !!cfg.wide && i % 7 === 6
      });
    }
    return out;
  }

  var opts = {
    target: target,
    sheetClass: 'sf-sheet',
    gridClass: 'grid cols-' + cols,
    renderItem: renderItem,
    renderHeader: cfg.noChrome ? null : renderHeader,
    renderFooter: cfg.noChrome ? null : renderFooter,
    mode: cfg.mode || 'fill'
  };

  if (cfg.mode === 'exactPages') {
    opts.pages = cfg.pages;
    opts.itemFactory = makeItems;
    opts.renumber = function (items) {
      items.forEach(function (it, i) { it.id = i + 1; });
    };
  } else if (cfg.mode === 'fixedChunk') {
    opts.items = makeItems(cfg.count || 20);
    opts.chunkSize = cfg.chunkSize;
  } else {
    opts.items = makeItems(cfg.count || 20);
  }

  SFPaginate.beginRender();
  return SFPaginate.paginate(opts).then(function (res) {
    SFPaginate.publish({
      sheets: res.sheets.length,
      requestedPages: cfg.pages || null,
      overflowRows: res.overflowRows,
      chunkSplits: res.chunkSplits,
      usedItems: res.usedItems,
      pageBreaks: res.pageBreaks
    });
    return {
      sheets: res.sheets.length,
      overflowRows: res.overflowRows,
      chunkSplits: res.chunkSplits,
      usedItems: res.usedItems,
      perPage: res.pageBreaks.map(function (p) { return p.length; })
    };
  });
};
</script>
</body>
</html>
