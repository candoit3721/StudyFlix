<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print calibration fixture</title>
<style>
  /*
   * Deliberately self-contained: calibration must not depend on
   * assets/sf/print.css, because print.css is one of the things it validates.
   * Every number here is a literal so a mistake in the shared vars cannot
   * make a broken calibration look correct.
   *
   * US Letter at 96 CSS dpi: 8.5in = 816px, 11in = 1056px.
   * With a 0.4in (38.4px) margin the printable box is 739.2 x 979.2px.
   */
  @page { size: letter portrait; margin: 0.4in; }

  :root {
    --page-w: 8.5in;  --page-h: 11in;  --page-margin: 0.4in;
    --print-w: calc(var(--page-w) - 2 * var(--page-margin));  /* 739.2px */
    --print-h: calc(var(--page-h) - 2 * var(--page-margin));  /* 979.2px */
    --cushion: 2px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #eef; font: 16px/1.4 system-ui, sans-serif; }

  .sheet {
    width: var(--print-w);
    /* One cushion pixel short of the printable height. If the browser puts
       this on two pages, our model of the print box is wrong. */
    height: calc(var(--print-h) - var(--cushion));
    background: #fff;
    border: 0;
    overflow: visible;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 0;
  }
  .sheet + .sheet { margin-top: 24px; }

  .marker { background: #000; color: #fff; font-weight: 700; padding: 2px 6px; }

  @media print {
    body { background: #fff; }
    .sheet { margin: 0 !important; page-break-after: always; break-after: page; }
    .sheet:last-of-type { page-break-after: auto; break-after: auto; }
  }
</style>
</head>
<body>
  <!-- Three sheets => a correct print run is exactly three pages. -->
  <div class="sheet" id="s1"><span class="marker">TOP-1</span><span class="marker">BOTTOM-1</span></div>
  <div class="sheet" id="s2"><span class="marker">TOP-2</span><span class="marker">BOTTOM-2</span></div>
  <div class="sheet" id="s3"><span class="marker">TOP-3</span><span class="marker">BOTTOM-3</span></div>
</body>
</html>
